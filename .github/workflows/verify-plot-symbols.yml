name: Verify Plot Symbols

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  verify-symbols:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsvg, any::DiagrammeRsvg
          needs: check

      - name: Generate plot exports
        run: |
          devtools::load_all(quiet = TRUE)

          mobi_mm <- constructs(
            reflective("Image",        multi_items("IMAG", 1:5)),
            reflective("Expectation",  multi_items("CUEX", 1:3)),
            reflective("Satisfaction", multi_items("CUSA", 1:3)),
            composite("Complaints",    single_item("CUSCO")),
            composite("Loyalty",       multi_items("CUSL", 1:3))
          )

          mobi_sm <- relationships(
            paths(from = "Image",        to = c("Expectation", "Satisfaction")),
            paths(from = "Expectation",  to = c("Satisfaction", "Complaints")),
            paths(from = "Satisfaction", to = "Complaints"),
            paths(from = "Complaints",   to = "Loyalty")
          )

          mobi_pls <- estimate_pls(data = mobi,
                                   measurement_model = mobi_mm,
                                   structural_model = mobi_sm)

          p <- plot(mobi_pls)

          dir.create("plot-artifacts", showWarnings = FALSE)
          save_plot("plot-artifacts/model.png", p)
          save_plot("plot-artifacts/model.pdf", p)

          # Also save raw SVG for inspection
          svg_text <- DiagrammeRsvg::export_svg(p)
          writeLines(svg_text, "plot-artifacts/model.svg")

          cat("Generated plot artifacts successfully\n")
        shell: Rscript {0}

      - name: Upload plot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plot-symbols-${{ matrix.os }}
          path: plot-artifacts/

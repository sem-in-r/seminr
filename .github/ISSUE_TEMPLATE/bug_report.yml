name: Bug Report
description: Report an error or unexpected behavior in SEMinR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as
        possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the error or unexpected behavior.
      placeholder: >
        e.g., summary() throws 'subscript out of bounds' after estimating
        a model with interaction terms
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Reproducible example
      description: |
        Minimal code that reproduces the issue. Ideally use a built-in
        dataset (mobi, corp_rep_data) or a small synthetic dataset.
      render: r
      placeholder: |
        library(seminr)

        mm <- constructs(
          composite("X", multi_items("x_", 1:3)),
          composite("Y", multi_items("y_", 1:3))
        )
        sm <- relationships(paths(from = "X", to = "Y"))

        model <- estimate_pls(data = mobi, mm, sm)
        summary(model)  # <-- error occurs here
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message or traceback
      description: Paste the full error message. Use traceback() if available.
      render: text

  - type: textarea
    id: versions
    attributes:
      label: Version information
      description: "Paste the output of: packageVersion('seminr') and sessionInfo()"
      render: text
    validations:
      required: true

  - type: textarea
    id: data-info
    attributes:
      label: Data description
      description: |
        If you can't share data, describe it: number of rows, number of
        indicators, any special characteristics (binary items, missing
        values, categorical columns, very few observations, etc.)

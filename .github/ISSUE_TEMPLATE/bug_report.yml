name: Bug Report
description: Report an unexpected error or behavior in SEMinR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a potential bug! Please fill in as much detail as
        possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the error or unexpected behavior.
      placeholder: >
        e.g., summary() throws 'subscript out of bounds' after estimating
        a model with interaction terms
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Reproducible example
      description: |
        Minimal code that reproduces the issue, starting with model creation. 
        We would be particularly grateful if you could make it relevant to a 
        built-in dataset (mobi, corp_rep_data) or a small synthetic dataset. 
        If you are using a custom dataset and we cannot reproduce your error easily,
        we might privately reach out to you to get a sample we can use.
      render: r
      placeholder: |
        library(seminr)

        mm <- constructs(
          composite("Image",        multi_items("IMAG", 1:5)),
          composite("Satisfaction", multi_items("CUSA", 1:3))
        )
        sm <- relationships(paths(from = "Image", to = "Satisfaction"))

        model <- estimate_pls(data = mobi, mm, sm)
        summary(model)  # <-- error occurs here
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message or traceback
      description: Paste the full error message. Use traceback() if available.
      render: text

  - type: textarea
    id: data-info
    attributes:
      label: Data description
      description: |
        If you can't share data, describe it: number of rows, number of
        indicators, any special characteristics (binary items, missing
        values, categorical columns, very few observations, etc.)

  - type: textarea
    id: versions
    attributes:
      label: Version information
      description: "Paste the output of: packageVersion('seminr') and sessionInfo()"
      render: text
    validations:
      required: true
